name: Build Android APK (CHLOÉ AI)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de compilation Android'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilation Android APK Samsung Galaxy S24
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Configuration de l'environnement Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configuration de Java OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 4. Configuration Android SDK & Licences
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          mkdir -p android
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          echo "Android SDK configuré : $SDK_DIR"
          mkdir -p "$SDK_DIR/licenses" 2>/dev/null || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e447b45250e18d144d800f7" > "$SDK_DIR/licenses/android-sdk-license" 2>/dev/null || true
          echo -e "\n84831b9409646a578e447b45250e18d144d800f7" > "$SDK_DIR/licenses/android-sdk-preview-license" 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 5. Installation des dépendances NPM
        run: |
          npm ci --legacy-peer-deps 2>/dev/null || npm install --legacy-peer-deps

      - name: 6. Vérification TypeScript & Linting
        run: |
          npm run lint

      - name: 7. Exécution des 20 Tests Automatisés du Cerveau CHLOÉ AI
        run: |
          npm test

      - name: 8. Compilation de l'application Web (Vite + PWA)
        run: |
          npm run build

      - name: 9. Synchronisation Native Capacitor Android
        run: |
          npx cap sync android

      - name: 10. Droits d'exécution sur le Gradle Wrapper et vérification SDK
        run: |
          chmod +x android/gradlew
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > android/local.properties

      - name: 11. Compilation Gradle de l'APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Diagnostic Kotlin si la compilation échoue
        if: failure()
        run: |
          cd android
          ./gradlew :app:dependencyInsight --dependency kotlin-stdlib --configuration debugRuntimeClasspath --no-daemon || true
          ./gradlew :app:dependencyInsight --dependency kotlin-stdlib-jdk7 --configuration debugRuntimeClasspath --no-daemon || true
          ./gradlew :app:dependencyInsight --dependency kotlin-stdlib-jdk8 --configuration debugRuntimeClasspath --no-daemon || true

      - name: 12. Vérification, renommage et calcul de l'empreinte SHA-256
        run: |
          APK_DEST="android/app/build/outputs/apk/debug/CHLOE-AI-Android-v1.0.0.apk"
          
          # Détection dynamique du fichier APK généré
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_ORIGINAL="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_ORIGINAL=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APK_ORIGINAL" ] || [ ! -f "$APK_ORIGINAL" ]; then
            echo "::error::Erreur: Fichier APK introuvable après compilation Gradle"
            find android/app/build -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p android/app/build/outputs/apk/debug
          cp "$APK_ORIGINAL" "$APK_DEST"
          
          SIZE_BYTES=$(stat -c%s "$APK_DEST" 2>/dev/null || stat -f%z "$APK_DEST")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES/1048576}")
          SHA256_HASH=$(sha256sum "$APK_DEST" | awk '{print $1}')
          
          echo "=================================================="
          echo "APK GÉNÉRÉ AVEC SUCCÈS POUR SAMSUNG GALAXY S24"
          echo "Nom du fichier : CHLOE-AI-Android-v1.0.0.apk"
          echo "Taille : $SIZE_MB Mo ($SIZE_BYTES octets)"
          echo "Empreinte SHA-256 : $SHA256_HASH"
          echo "Package ID : ai.chloe.assistant"
          echo "Version : 1.0.0 (Code 1)"
          echo "=================================================="

          echo "APK_SIZE=$SIZE_MB Mo" >> $GITHUB_ENV
          echo "APK_SHA256=$SHA256_HASH" >> $GITHUB_ENV

          echo "### 📱 Rapport de Compilation Android CHLOÉ AI" >> $GITHUB_STEP_SUMMARY
          echo "- **Statut :** ✅ Succès (Compilation Gradle vérifiée)" >> $GITHUB_STEP_SUMMARY
          echo "- **Nom de l'APK :** \`CHLOE-AI-Android-v1.0.0.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID :** \`ai.chloe.assistant\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Taille :** $SIZE_MB Mo" >> $GITHUB_STEP_SUMMARY
          echo "- **Empreinte SHA-256 :** \`$SHA256_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cible :** Samsung Galaxy S24 (Android 14+ / One UI 6.1)" >> $GITHUB_STEP_SUMMARY

      - name: 13. Téléversement de l'APK dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: CHLOE-AI-Android-v1.0.0-apk
          path: android/app/build/outputs/apk/debug/CHLOE-AI-Android-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
